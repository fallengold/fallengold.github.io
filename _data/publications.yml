main:
  - title: "BlenderFORGE: Framework for Optimizing Reactive 3D-Graphics Editing Ability of MLLMs"
    authors: <strong>Zilin Guo</strong>, Tianrui Zhang, Yi Rong, Yichen Liu, Yuxin Guo, Jingcheng Ni, Lewei Lu, Zehuan Wu, Dan Xu
    conference_short: NeurIPS
    image: ./assets/img/blenderforge-main-graph.png
    image_alt: "BlenderFORGE framework overview: scene construction, Blender Sandbox, trajectory supervision, and reinforcement learning."
    image_link: ./assets/files/blenderforge-main-graph.pdf
    conference: Conference on Neural Information Processing Systems <strong>(NeurIPS)</strong>, 2026.
    summary: A data, environment, and optimization framework for training open-weight multimodal agents to edit Blender scenes through Python code, combining supervised fine-tuning with multi-turn reinforcement learning and state-verifiable rewards.
